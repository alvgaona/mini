pre-commit:
  jobs:
    - name: check
      run: NATIVE_SDK_PATH="${NATIVE_SDK_PATH:-$HOME/git/native}" native check --strict

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  jobs:
    - name: test
      run: NATIVE_SDK_PATH="${NATIVE_SDK_PATH:-$HOME/git/native}" native test --yes
