name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: mini
          # git-cliff needs tag history for the release-notes range.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: alvgaona/native
          ref: main
          path: native

      - uses: oven-sh/setup-bun@v2

      - name: Install Native CLI
        run: bun install -g @native-sdk/cli

      - name: Build app
        working-directory: mini
        run: NATIVE_SDK_PATH="$GITHUB_WORKSPACE/native" native build --yes -Dweb-engine=system

      - name: Build fork CLI
        working-directory: native
        run: |
          "$HOME"/.native/toolchains/zig-*/zig build cli

      - name: Package app
        working-directory: mini
        run: |
          "$GITHUB_WORKSPACE"/native/zig-out/bin/native package --target macos --signing adhoc --web-engine system

      - name: Zip release content
        working-directory: mini
        run: ditto -c -k --keepParent zig-out/package/mini.app mini.app.zip

      - name: release notes
        working-directory: mini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx git-cliff --latest --strip header -o release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: mini/mini.app.zip
          body_path: mini/release-notes.md
          # Any dash-suffixed tag (v0.1.0-a.1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
